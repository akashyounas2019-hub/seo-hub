version: '3.8'

services:
  seo-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-hub-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=changeme123
      - GYL_WORKER_SECRET=default_secret
    volumes:
      - seo_hub_data:/app/.data

volumes:
  seo_hub_data:
